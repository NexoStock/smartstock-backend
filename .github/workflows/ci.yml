
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (Java 27)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smartstock_ci_only
          MYSQL_DATABASE: nexostock_sales_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psmartstock_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: smartstock_ci_only

      DATABASE_USER: root
      DATABASE_PASSWORD: smartstock_ci_only
      DATABASE_URL: localhost
      DATABASE_PORT: "3306"
      DATABASE_NAME: nexostock_sales_it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          chmod +x mvnw
          ./mvnw -B -version

      - name: Build and run unit and integration tests
        run: ./mvnw -B clean verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image (not pushed)
        run: docker build -t nexostock-backend:${{ github.sha }} .
