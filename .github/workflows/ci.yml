name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (Java 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          chmod +x mvnw
          ./mvnw -B -version

      - name: Build and run tests
        run: ./mvnw -B clean verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        run: docker build -t nexostock-backend:${{ github.sha }} .
