
# ==========================================
# NEXOSTOCK - LOCAL CONFIGURATION
# ==========================================

# DATABASE - MYSQL
spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:nexostock}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# JWT - LOCAL DEVELOPMENT ONLY
app.jwt.secret=${JWT_SECRET:local-only-secret-change-me-in-production-0123456789}

# CORS - ANGULAR FRONTEND
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# SWAGGER - API DOCUMENTATION
documentation.server.production-url=${PUBLIC_API_URL:http://localhost:8080}

# EMAIL - SMTP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# NOTIFICATIONS
app.notifications.from=${MAIL_FROM:nexostock@localhost}

# WHATSAPP - TWILIO
app.twilio.sid=${TWILIO_ACCOUNT_SID:}
app.twilio.token=${TWILIO_AUTH_TOKEN:}
app.twilio.from=${TWILIO_WHATSAPP_FROM:}
