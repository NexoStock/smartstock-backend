spring.application.name=nexostock-backend
server.port=${PORT:8080}

# Default profile

# JPA and Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.nexostock.backend.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Internationalization
spring.messages.basename=messages

# JWT
app.jwt.expiration-hours=8

# Swagger
documentation.application.name=@project.name@
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Notifications
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.notifications.interval-ms=10000