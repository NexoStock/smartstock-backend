# Production profile
# Required environment variables

spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}?serverTimezone=UTC&sslMode=${DATABASE_SSL_MODE:REQUIRED}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Security
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger
documentation.server.production-url=${PUBLIC_API_URL}

# Email
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Notifications
app.notifications.from=${MAIL_FROM:}

# Twilio
app.twilio.sid=${TWILIO_ACCOUNT_SID:}
app.twilio.token=${TWILIO_AUTH_TOKEN:}
app.twilio.from=${TWILIO_WHATSAPP_FROM:}